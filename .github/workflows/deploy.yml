name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        run: npm ci

      # Local plugins in plugins/ are symlinked into .quartz/plugins, never built by Quartz.
      # --from-config resolves them from quartz.config.yaml (quartz.lock.json records local
      # plugins by absolute path, which only exists on the machine that wrote it).
      - name: Build and install Quartz plugins
        run: |
          npm run plugins:build
          npx quartz plugin install --from-config

      # Get a fresh Strava access token.
      # Note: download-artifact only sees artifacts from the current run, so this never finds
      # a previous token and the refresh always bootstraps from STRAVA_BOOTSTRAP_REFRESH_TOKEN.
      - name: Download previous encrypted token
        uses: actions/download-artifact@v4
        with:
          name: strava-token
        continue-on-error: true

      - name: Decrypt token if present
        if: hashFiles('strava-token.json.enc') != ''
        run: node scripts/decrypt-token.js strava-token.json.enc > strava-token.json
        env:
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}

      - name: Refresh token if needed
        run: node scripts/refresh-token.js
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_BOOTSTRAP_REFRESH_TOKEN: ${{ secrets.STRAVA_BOOTSTRAP_REFRESH_TOKEN }}

      - name: Encrypt updated token
        run: node scripts/encrypt-token.js strava-token.json
        env:
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}

      - name: Upload updated encrypted token
        uses: actions/upload-artifact@v4
        with:
          name: strava-token
          path: strava-token.json.enc

      - name: Use Strava access token
        run: |
          echo "STRAVA_ACCESS_TOKEN=$(jq -r '.access_token' strava-token.json)" >> .env

      # Maps and GPX files from Mapbox/Strava (plugins/activity-map). A new cache is saved on
      # every run and the newest one restored, so new files are only downloaded once. The last
      # restore key is the v4 cache, which activity-map migrates to its new layout. (A cache
      # only restores into the same paths it was saved from, hence two steps.)
      - name: Cache maps
        uses: actions/cache@v4
        with:
          path: quartz/.quartz-cache/maps
          key: activity-map-maps-${{ github.run_id }}
          restore-keys: |
            activity-map-maps-
            quartz-maps-v2025.12.01.0
      - name: Cache GPX files
        uses: actions/cache@v4
        with:
          path: quartz/.quartz-cache/gpx
          key: activity-map-gpx-${{ github.run_id }}
          restore-keys: |
            activity-map-gpx-
            quartz-gpx-v2025.12.01.0

      - name: Build Quartz
        run: npx quartz build
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
